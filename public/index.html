<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Quiz App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-top">
      <span class="sidebar-brand">&#127891; <span class="brand-text">AI Quiz</span></span>
      <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item" id="nav-new" title="New Quiz">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span class="nav-label">New Quiz</span>
      </button>
      <button class="nav-item" id="nav-settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="nav-label">Settings</span>
      </button>
      <button class="nav-item" id="nav-history" title="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
        <span class="nav-label">History</span>
      </button>
    </nav>

    <div class="sidebar-bottom">
      <button class="nav-item" id="nav-account" title="Account">
        <span class="nav-avatar" id="nav-avatar"></span>
        <span class="nav-account-text">
          <span class="nav-label" id="nav-account-name">Sign in</span>
          <span class="nav-label sub" id="nav-account-email"></span>
        </span>
      </button>
      <button class="nav-icon-btn hidden" id="nav-signout" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="app">
      <header>
        <div class="brand-badge">&#127891; AI QUIZ</div>
        <h1>Turn your module into a quiz</h1>
        <p>Upload your PDF, answer AI-generated flashcards, and see how well you know the material.</p>
      </header>

      <!-- Upload screen -->
      <section id="upload-screen" class="screen">
        <div class="card upload-card">
          <label for="file-input" class="drop-zone" id="drop-zone">
            <span class="dz-icon">&#128196;</span>
            <span class="dz-title">Click or drag a PDF here</span>
            <span class="dz-sub" id="upload-sub">Your module will be analyzed by AI to create <strong id="flashcard-count-label">10</strong> flashcards</span>
          </label>
          <input type="file" id="file-input" accept=".pdf" hidden />
          <div id="file-name" class="file-name"></div>
          <button id="upload-btn" class="btn btn-primary">
            <span class="btn-label">Analyze Module &amp; Start Quiz</span>
            <span class="btn-arrow">&#8594;</span>
          </button>
          <div id="upload-status" class="status"></div>
        </div>
      </section>

      <!-- History screen -->
      <section id="history-screen" class="screen hidden">
        <div class="card history-card">
          <div class="history-head">
            <h3>&#128220; Your quiz history</h3>
            <span id="history-count" class="history-count"></span>
          </div>
          <div id="history-list" class="history-list"></div>
        </div>
      </section>

      <!-- Quiz screen -->
      <section id="quiz-screen" class="screen hidden">
        <div class="grading-area">
          <div class="grading-pill" id="grading-pill">
            <span class="mini-spinner"></span>
            <span id="grading-pill-text">Grading your answer…</span>
          </div>
        </div>
        <div class="deck" id="deck"></div>
      </section>

      <!-- Results screen -->
      <section id="results-screen" class="screen hidden">
        <div class="card results-card">
          <div class="results-head">
            <span class="brand-badge">&#127942; QUIZ COMPLETE</span>
            <h2 id="results-title">Here's how you did</h2>
            <p id="results-save-note" class="save-note hidden">Saved to your history &#10003;</p>
          </div>
          <div class="score-circle" id="score-circle">
            <span id="score-percent"></span>
            <span id="score-label"></span>
          </div>
          <div class="score-stats" id="score-stats"></div>
          <div id="results-details"></div>
          <button id="restart-btn" class="btn btn-primary">
            <span class="btn-label">Try Another Module</span>
            <span class="btn-arrow">&#8635;</span>
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- Auth modal -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-backdrop" id="auth-backdrop"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="auth-title">Sign in</h3>
        <button id="auth-close" class="modal-close">&times;</button>
      </div>
      <div class="auth-tabs">
        <button id="tab-signin" class="auth-tab active">Sign in</button>
        <button id="tab-signup" class="auth-tab">Sign up</button>
      </div>
      <form id="auth-form">
        <label class="field-label" for="auth-email">Email</label>
        <input id="auth-email" type="email" required autocomplete="email" placeholder="you@example.com" />
        <label class="field-label" for="auth-password">Password</label>
        <input id="auth-password" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters" />
        <div id="auth-error" class="auth-error"></div>
        <button type="submit" id="auth-submit" class="btn btn-primary">
          <span class="btn-label">Sign in</span>
        </button>
      </form>
      <p id="auth-hint" class="auth-hint"></p>
    </div>
  </div>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-backdrop" id="settings-backdrop"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h3>Settings</h3>
        <button id="settings-close" class="modal-close">&times;</button>
      </div>
      <label class="field-label">Number of flashcards per quiz</label>
      <div class="settings-options" id="settings-options">
        <button class="settings-option" data-count="5">5</button>
        <button class="settings-option" data-count="10">10</button>
        <button class="settings-option" data-count="15">15</button>
        <button class="settings-option" data-count="20">20</button>
      </div>
      <p class="auth-hint">Saved automatically.</p>
    </div>
  </div>

  <script src="/vendor/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
